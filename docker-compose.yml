services:
  # ── PersonaAI API ───────────────────────────────────────────
  personaai:
    build: .
    container_name: personaai-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/personaai.db
    # Mount a directory, not the .db file itself. Bind-mounting a file that
    # does not exist yet makes Docker create a directory with that name,
    # which SQLite then fails to open.
    volumes:
      - personaai-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Streamlit Dashboard ─────────────────────────────────────
  dashboard:
    build: .
    container_name: personaai-dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      PERSONAAI_DB_PATH: /app/data/personaai.db
    volumes:
      - personaai-data:/app/data
    command: ["streamlit", "run", "streamlit_dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      personaai:
        condition: service_healthy
    restart: unless-stopped

volumes:
  personaai-data:
